name: vocatogether
description: "VocaTogether Android app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  google_sign_in_platform_interface: ^3.1.0

flutter:
  uses-material-design: true
  # Runs gen-l10n (l10n.yaml) on pub get, run, build and test.
  generate: true
  assets:
    - assets/google/
